apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-client
spec:
  selector:
    matchLabels:
      app: fake-client
  template:
    metadata:
      labels:
        app: fake-client
    spec:
      initContainers:
      - name: init-iptables
        image: wbitt/network-multitool:minimal
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
        command:
        - sh
        - -c
        - |
          iptables -t nat -A OUTPUT \
            -m owner --uid-owner 1337 \
            -j RETURN

          iptables -t nat -A OUTPUT \
            -d 127.0.0.1/32 \
            -j RETURN

          iptables -t nat -A OUTPUT \
            -p tcp --dport 15001 \
            -j RETURN

          iptables -t nat -A OUTPUT \
            -p tcp \
            -j REDIRECT --to-port 15001
          
          iptables -t nat -A PREROUTING \
            -p tcp --dport 5678 \
            -j REDIRECT --to-port 15001
      containers:
      - name: fake-client
        image: hjmasha/fakeclient:v0.1.2
        command: ["top"]
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
          requests:
            memory: "64Mi"
            cpu: "250m"
      - name: sidecar
        image: hjmasha/transparent:v0.1.14
        command: ["/app/sidecar"]
        securityContext:
          runAsGroup: 1337
          runAsUser: 1337
          runAsNonRoot: true
        ports:
        - containerPort: 15001
        resources:
          requests:
            memory: "32Mi"
            cpu: "100m"
          limits:
            memory: "64Mi"
            cpu: "200m"

